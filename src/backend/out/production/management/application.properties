spring.application.name=management
server.port=8080

# MySQL 数据库（本机 8.0，库名 robot_arm）
spring.datasource.url=jdbc:mysql://localhost:3306/robot_arm?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=lyt060413
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表结构由 Flyway 迁移脚本管理，JPA 不建表也不校验
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JSON 字段统一使用 OpenAPI 契约中的 snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# 机械臂动作代理（板子上的 robot_agent.py，默认监听 5005）
robot.agent.base-url=http://192.168.137.100:5005
robot.agent.connect-timeout-ms=2000
robot.agent.request-timeout-ms=5000
