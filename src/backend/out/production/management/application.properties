spring.application.name=management
server.port=8080

# H2 开发数据库（文件持久化，便于事件留存与联调）
spring.datasource.url=jdbc:h2:file:./data/management
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 表结构由 Flyway 迁移脚本管理，JPA 不建表也不校验
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JSON 字段统一使用 OpenAPI 契约中的 snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# 开发期可通过 http://localhost:8080/h2-console 查看数据
spring.h2.console.enabled=true
